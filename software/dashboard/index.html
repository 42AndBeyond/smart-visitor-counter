<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Visitor Counter</title>
<style>
  body { margin: 0; font-family: Arial, sans-serif; background: #0f172a; color: #e2e8f0; }
  header { padding: 20px 32px; border-bottom: 1px solid #1e293b; }
  header small { color: #3b82f6; font-weight: bold; letter-spacing: 1px; }
  header h1 { margin: 4px 0 0; font-size: 26px; }
  main { padding: 24px 32px; max-width: 1000px; }
  h2 { font-size: 13px; color: #94a3b8; letter-spacing: 1px; text-transform: uppercase; margin: 28px 0 12px; }
  .row { display: flex; gap: 16px; flex-wrap: wrap; }
  .card { flex: 1; min-width: 180px; background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 18px; }
  .big { font-size: 42px; font-weight: bold; }
  .label { color: #94a3b8; margin-top: 4px; }
  .grocery { border-left: 5px solid #10b981; }
  .snacks { border-left: 5px solid #f97316; }
  .freezer { border-left: 5px solid #06b6d4; }
  #status { float: right; font-size: 13px; color: #10b981; }
  .controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 4px; }
  .controls input, .controls button { background: #1e293b; color: #e2e8f0; border: 1px solid #334155; border-radius: 8px; padding: 8px 12px; font-size: 14px; }
  .controls button { cursor: pointer; background: #2563eb; border-color: #2563eb; }
  #mode { color: #94a3b8; font-size: 14px; }
  .feed { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 6px 18px; }
  .event { display: flex; gap: 14px; padding: 9px 0; border-bottom: 1px solid #334155; font-size: 14px; }
  .event:last-child { border-bottom: none; }
  .event .time { color: #94a3b8; width: 70px; }
  .event .tag { font-weight: bold; width: 110px; }
  .ENTRY { color: #10b981; }
  .EXIT { color: #ef4444; }
  .ZONE_ENTER { color: #3b82f6; }
  .ZONE_LEAVE { color: #f97316; }
  .chart { display: flex; gap: 4px; background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 18px 18px 10px; }
  .col { flex: 1; text-align: center; }
  .barbox { height: 120px; display: flex; align-items: flex-end; }
  .bar { width: 100%; background: #3b82f6; border-radius: 4px 4px 0 0; min-height: 2px; }
  .bar.peak { background: #f97316; }
  .hlabel { font-size: 10px; color: #94a3b8; margin-top: 4px; }
</style>
</head>
<body>
<header>
  <small>SMART STORE TELEMETRY</small>
  <span id="status">connecting...</span>
  <h1>Smart Visitor Counter</h1>
</header>
<main>
  <div class="controls">
    <label>Date: <input type="date" id="day"></label>
    <button id="todayBtn">Today (live)</button>
    <span id="mode"></span>
  </div>
  <h2>Overall</h2>
  <div class="row">
    <div class="card"><div class="big" id="entered">0</div><div class="label">Entered</div></div>
    <div class="card"><div class="big" id="exited">0</div><div class="label">Exited</div></div>
    <div class="card"><div class="big" id="inside">0</div><div class="label">Currently inside</div></div>
  </div>
  <h2>Zones</h2>
  <div class="row" id="zones"></div>
  <h2>Hourly visitor flow</h2>
  <div class="chart" id="chart"></div>
  <div class="label" id="peak"></div>
  <h2>Live events</h2>
  <div class="feed" id="feed"></div>
</main>
<script>
  let selectedDay = null;
  const dayInput = document.getElementById("day");

  function todayString() {
    return new Date().toLocaleDateString("en-CA");
  }

  dayInput.addEventListener("change", () => {
    selectedDay = dayInput.value && dayInput.value !== todayString() ? dayInput.value : null;
    refresh();
  });

  document.getElementById("todayBtn").addEventListener("click", () => {
    selectedDay = null;
    refresh();
  });

  function renderHourly(data) {
    const chart = document.getElementById("chart");
    chart.textContent = "";
    const max = Math.max(1, ...data.hours.map(h => h.visitors));
    for (const h of data.hours) {
      const col = document.createElement("div");
      col.className = "col";
      col.title = String(h.hour).padStart(2, "0") + ":00 - " + h.visitors + " visitors";
      const box = document.createElement("div");
      box.className = "barbox";
      const bar = document.createElement("div");
      bar.className = "bar" + (h.hour === data.peak_hour ? " peak" : "");
      bar.style.height = (h.visitors / max * 100) + "%";
      box.appendChild(bar);
      const label = document.createElement("div");
      label.className = "hlabel";
      label.textContent = String(h.hour).padStart(2, "0");
      col.append(box, label);
      chart.appendChild(col);
    }
    const peak = document.getElementById("peak");
    if (data.peak_hour === null) {
      peak.textContent = "Peak hour: no visitors yet";
    } else {
      const p = data.hours[data.peak_hour];
      const start = String(data.peak_hour).padStart(2, "0");
      const end = String((data.peak_hour + 1) % 24).padStart(2, "0");
      peak.textContent = "Peak hour: " + start + ":00 - " + end + ":00 (" + p.visitors + " visitors)";
    }
  }

  async function refresh() {
    const status = document.getElementById("status");
    const dayQuery = selectedDay ? "day=" + selectedDay : "";
    try {
      if (selectedDay === null) {
        dayInput.max = todayString();
        dayInput.value = todayString();
        document.getElementById("mode").textContent = "Showing today (live)";
      } else {
        document.getElementById("mode").textContent = "Showing history for " + selectedDay;
      }

      const res = await fetch("/stats?" + dayQuery);
      const data = await res.json();
      document.getElementById("entered").textContent = data.entered;
      document.getElementById("exited").textContent = data.exited;
      document.getElementById("inside").textContent = data.inside;

      let html = "";
      for (const [name, z] of Object.entries(data.zones)) {
        html += `<div class="card ${name}">
          <div class="label">${name.toUpperCase()}</div>
          <div class="big">${z.inside}</div>
          <div class="label">inside now · ${z.visits} visits</div>
        </div>`;
      }
      document.getElementById("zones").innerHTML = html;

      const hourlyRes = await fetch("/hourly?" + dayQuery);
      renderHourly(await hourlyRes.json());

      const evRes = await fetch("/events?limit=10&" + dayQuery);
      const events = await evRes.json();
      const feed = document.getElementById("feed");
      feed.textContent = "";
      for (const e of events) {
        const row = document.createElement("div");
        row.className = "event";
        const t = document.createElement("span");
        t.className = "time";
        t.textContent = e.time.slice(11, 19);
        const tag = document.createElement("span");
        tag.className = "tag " + e.type;
        tag.textContent = e.type;
        const where = document.createElement("span");
        where.textContent = e.zone;
        row.append(t, tag, where);
        feed.appendChild(row);
      }

      status.textContent = "● live";
      status.style.color = "#10b981";
    } catch (error) {
      status.textContent = "● offline";
      status.style.color = "#ef4444";
    }
  }
  refresh();
  setInterval(refresh, 2000);
</script>
</body>
</html>
